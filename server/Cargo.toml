[package]
name = "spinforge-server"
version = "0.1.0"
edition = "2021"
description = "SpinForge backend — Beyblade X blockchain card game on Sui"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# Cache
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Blockchain
sui-sdk = { git = "https://github.com/MystenLabs/sui", branch = "mainnet" }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# WebSocket stream utilities
futures-util = "0.3"

# Crypto (for commit-reveal hashing)
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
